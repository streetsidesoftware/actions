name: ' 🔗 Update PNPM'

# Updates the pnpm version pinned in `package.json` and opens a PR with the change.
#
# Other streetsidesoftware repos call this workflow from a job:
#
#   jobs:
#     update-pnpm:
#       uses: streetsidesoftware/actions/.github/workflows/update-pnpm.yml@v1
#       secrets: inherit
#
# The caller needs the secrets `AUTOMATION_APP_ID` and `AUTOMATION_PRIVATE_KEY`.

on:
  workflow_dispatch:
    inputs:
      base:
        description: The Base Ref to apply the diff
        required: false
        default: 'main'

  workflow_call:
    inputs:
      base:
        description: The Base Ref to apply the diff
        required: false
        default: 'main'
        type: string

  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  update-pnpm:
    if: github.repository_owner == 'streetsidesoftware'
    runs-on: ubuntu-latest
    env:
      NEW_BRANCH: update-pnpm-${{ inputs.base || 'main' }}
      REF_BRANCH: ${{ inputs.base || 'main' }}
      PR_TYPE: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF_BRANCH }}

      # The shared `setup-node-pnpm` action is not used here. It installs Corepack's `pnpm` shim,
      # and pnpm refuses to self-update when Corepack runs it.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Update PNPM
        # The self-update changes only package.json.
        # The install records the new pnpm version in the lockfile.
        env:
          # The self-update does not read `minimumReleaseAge` from pnpm-workspace.yaml, so it is set here.
          # Two days is the value the streetsidesoftware repos use in that file.
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: 2880 # two days
        run: |
          pnpm self-update
          pnpm install --lockfile-only

      # The actions below are referenced by repository, not by local path.
      # A local path would resolve in the calling repo's checkout.
      - name: Gen Body
        id: git-body
        uses: streetsidesoftware/actions/public/pr-body@v1
        with:
          title: Update PNPM ${{ env.REF_BRANCH }}
          path: package.json

      - name: PR
        uses: streetsidesoftware/actions/.github/actions/pr@v1
        with:
          commit-message: '${{ env.PR_TYPE }}: Workflow Bot -- Update PNPM'
          branch: ${{ env.NEW_BRANCH }}
          base: ${{ env.REF_BRANCH }}
          title: '${{ env.PR_TYPE }}: Workflow Bot -- Update PNPM (${{ env.REF_BRANCH }})'
          body: ${{ steps.git-body.outputs.body }}
          app_id: ${{ secrets.AUTOMATION_APP_ID }}
          app_private_key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}

      - name: Summary
        uses: streetsidesoftware/actions/public/summary@v1
        with:
          text: ${{ steps.git-body.outputs.body }}
