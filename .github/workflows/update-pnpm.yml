name: ' 🔗 Update PNPM'

on:
  workflow_dispatch:
    inputs:
      base:
        description: The Base Ref to apply the diff
        required: false
        default: 'main'

  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  update-pnpm:
    if: github.repository_owner == 'streetsidesoftware'
    runs-on: ubuntu-latest
    env:
      NEW_BRANCH: update-pnpm-${{ inputs.base || 'main' }}
      REF_BRANCH: ${{ inputs.base || 'main' }}
      PR_TYPE: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF_BRANCH }}

      # The shared `setup-node-pnpm` action is not used here. It installs Corepack's `pnpm` shim,
      # and pnpm refuses to self-update when Corepack runs it.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Update PNPM
        # The self-update changes only package.json.
        # The install records the new pnpm version in the lockfile.
        run: |
          pnpm self-update
          pnpm install --lockfile-only

      - name: Gen Body
        id: git-body
        uses: ./public/pr-body
        with:
          title: Update PNPM ${{ env.REF_BRANCH }}
          path: package.json

      - name: PR
        uses: ./.github/actions/pr
        with:
          commit-message: '${{ env.PR_TYPE }}: Workflow Bot -- Update PNPM'
          branch: ${{ env.NEW_BRANCH }}
          base: ${{ env.REF_BRANCH }}
          title: '${{ env.PR_TYPE }}: Workflow Bot -- Update PNPM (${{ env.REF_BRANCH }})'
          body: ${{ steps.git-body.outputs.body }}
          app_id: ${{ secrets.AUTOMATION_APP_ID }}
          app_private_key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}

      - name: Summary
        uses: streetsidesoftware/actions/public/summary@v1
        with:
          text: ${{ steps.git-body.outputs.body }}
